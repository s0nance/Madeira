<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Frame plus a title bar. The bar is what separates "a window" from "a
       video player": without it, a play mark in a rounded rectangle is the
       universal media-player icon and says nothing about what Madeira runs.
       A d-pad was tried instead of the play mark and read as a medical cross. -->
  <rect x="232" y="232" width="560" height="560" rx="104" ry="104"
        fill="none" stroke="#ffffff" stroke-width="58"/>
  <rect x="316" y="322" width="392" height="38" rx="19" ry="19" fill="#ffffff"/>
</svg>
