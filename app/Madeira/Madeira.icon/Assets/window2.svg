<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Just the frame. A title bar lived here to argue that the rounded
       rectangle was a window rather than a video player, which mattered while
       the mark inside was a play triangle. With a bold M in there the frame is
       no longer carrying that meaning on its own, so the bar was decoration
       competing with the letter for the same space. -->
  <rect x="232" y="232" width="560" height="560" rx="104" ry="104"
        fill="none" stroke="#ffffff" stroke-width="58"/>
</svg>
